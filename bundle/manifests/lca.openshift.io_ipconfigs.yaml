    name: v1
    schema:
      openAPIV3Schema:
        description: IPConfig is the Schema for controlling node IP configuration
          lifecycle via lca-cli ip-config.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IPConfigSpec defines the desired state of IPConfig
            properties:
              autoRollbackOnFailure:
                description: |-
                  AutoRollbackOnFailure defines automatic rollback settings for IPConfig if the configuration
                  does not complete within the specified time limit. Behavior mirrors IBU.
                properties:
                  initMonitorTimeoutSeconds:
                    description: |-
                      InitMonitorTimeoutSeconds defines the time frame in seconds. If not defined or set to 0,
                      the default value of 1800 seconds (30 minutes) is used.
                    minimum: 0
                    type: integer
                type: object
              ipv4:
                description: IPv4 stack (omit for IPv6-only)
                properties:
                  address:
                    description: Address is the full address with prefix length (e.g.,
                      192.0.2.10/24)
                    type: string
                  dnsServer:
                    description: DNSServer is the DNS server IP to use
                    type: string
                  gateway:
                    description: Gateway is the default gateway address
                    type: string
                  machineNetwork:
                    description: MachineNetwork is the CIDR of the machine network
                      (e.g., 192.0.2.0/24)
                    type: string
                type: object
              ipv6:
                description: IPv6 stack (omit for IPv4-only)
                properties:
                  address:
                    description: Address is the full address with prefix length (e.g.,
                      192.0.2.10/24)
                    type: string
                  dnsServer:
                    description: DNSServer is the DNS server IP to use
                    type: string
                  gateway:
                    description: Gateway is the default gateway address
                    type: string
                  machineNetwork:
                    description: MachineNetwork is the CIDR of the machine network
                      (e.g., 192.0.2.0/24)
                    type: string
                type: object
              proxy:
                description: Optional proxy settings
                properties:
                  httpProxy:
                    type: string
                  httpsProxy:
                    type: string
                  noProxy:
                    items:
                      type: string
                    type: array
                type: object
              recert:
                description: Recert configuration
                properties:
                  cacheInterval:
                    description: |-
                      cacheInterval defines how often the controller attempts to cache the recert image on the host
                      when IPConfig is Idle. If unset, a default is used.
                    type: string
                  image:
                    description: image is the full pull-spec of the recert container
                      image to use
                    type: string
                  pullSecretRef:
                    description: pullSecretRef is the name of a Secret in the lifecycle-agent
                      namespace containing .dockerconfigjson
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              stage:
                description: IPConfigStage defines the type for the stage field
                enum:
                - Idle
                - Config
                - Rollback
                type: string
              vlan:
                description: Optional VLAN applied to br-ex path
                properties:
                  id:
                    type: integer
                type: object
            type: object
          status:
            description: IPConfigStatus defines the observed state of IPConfig
            properties:
              conditions:
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              history:
                description: History stores timing info of different IPConfig stages
                  and their important phases
                items:
                  description: IPHistory mirrors IBU history for IPConfig stages
                  properties:
                    completionTime:
                      description: CompletionTime A timestamp indicating the Stage
                        completed successfully
                      format: date-time
                      type: string
                    phases:
                      description: Phases allows a granular view of important tasks
                        within a Stage
                      items:
                        description: IPPhase represents a sub-step within a stage
                        properties:
                          completionTime:
                            description: CompletionTime A timestamp indicating the
                              phase completed successfully
                            format: date-time
                            type: string
                          phase:
                            description: Phase current phase within a Stage
                            type: string
                          startTime:
                            description: StartTime A timestamp indicating the Phase
                              has started
                            format: date-time
                            type: string
                        type: object
                      type: array
                    stage:
                      description: Stage The desired stage name read from spec
                      type: string
                    startTime:
                      description: StartTime A timestamp to indicate the Stage has
                        started
                      format: date-time
                      type: string
                  type: object
                type: array
              network:
                description: Network groups host and cluster network information
                properties:
                  clusterNetwork:
                    description: ClusterNetwork summarizes cluster network using lists
                      of strings
                    properties:
                      ipv4:
                        description: IPv4 summarizes the current IPv4 on the cluster
                          network
                        properties:
                          address:
                            description: Address is the node internal IP (plain address,
                              no prefix)
                            type: string
                          machineNetwork:
                            description: MachineNetwork is the matching machine network
                              CIDR for the IP
                            type: string
                        type: object
                      ipv6:
                        description: IPv6 summarizes the current IPv6 on the cluster
                          network
                        properties:
                          address:
                            description: Address is the node internal IP (plain address,
                              no prefix)
                            type: string
                          machineNetwork:
                            description: MachineNetwork is the matching machine network
                              CIDR for the IP
                            type: string
                        type: object
                    type: object
                  hostNetwork:
                    description: HostNetwork summarizes current host network
                    properties:
                      ipv4:
                        description: IPFamilyConfig represents a single stack configuration
                        properties:
                          address:
                            description: Address is the full address with prefix length
                              (e.g., 192.0.2.10/24)
                            type: string
                          dnsServer:
                            description: DNSServer is the DNS server IP to use
                            type: string
                          gateway:
                            description: Gateway is the default gateway address
                            type: string
                          machineNetwork:
                            description: MachineNetwork is the CIDR of the machine
                              network (e.g., 192.0.2.0/24)
                            type: string
                        type: object
                      ipv6:
                        description: IPFamilyConfig represents a single stack configuration
                        properties:
                          address:
                            description: Address is the full address with prefix length
                              (e.g., 192.0.2.10/24)
                            type: string
                          dnsServer:
                            description: DNSServer is the DNS server IP to use
                            type: string
                          gateway:
                            description: Gateway is the default gateway address
                            type: string
                          machineNetwork:
                            description: MachineNetwork is the CIDR of the machine
                              network (e.g., 192.0.2.0/24)
                            type: string
                        type: object
                    type: object
                type: object
              observedGeneration:
                format: int64
                type: integer
              validNextStages:
                description: ValidNextStages enumerates allowed next transitions from
                  current stage
                items:
                  description: IPConfigStage defines the type for the stage field
                  type: string
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: ipconfig is a singleton, metadata.name must be 'ipconfig'
          rule: self.metadata.name == 'ipconfig'
        - message: can not change spec.ipv4 while ipconfig is in progress
          rule: '!has(oldSelf.status) || oldSelf.status.conditions.exists(c, c.type==''Idle''
            && c.status==''True'') || has(oldSelf.spec.ipv4) && has(self.spec.ipv4)
            && oldSelf.spec.ipv4==self.spec.ipv4 || !has(self.spec.ipv4) && !has(oldSelf.spec.ipv4)'
        - message: can not change spec.ipv6 while ipconfig is in progress
          rule: '!has(oldSelf.status) || oldSelf.status.conditions.exists(c, c.type==''Idle''
            && c.status==''True'') || has(oldSelf.spec.ipv6) && has(self.spec.ipv6)
            && oldSelf.spec.ipv6==self.spec.ipv6 || !has(self.spec.ipv6) && !has(oldSelf.spec.ipv6)'
    served: true
    storage: true
    subresources:
      status: {}
