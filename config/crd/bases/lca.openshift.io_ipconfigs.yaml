---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipconfigs.lca.openshift.io
spec:
  group: lca.openshift.io
  names:
    kind: IPConfig
    listKind: IPConfigList
    plural: ipconfigs
    shortNames:
    - ipc
    singular: ipconfig
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.stage
      name: Desired Stage
      type: string
    - jsonPath: .status.conditions[-1:].reason
      name: State
      type: string
    - jsonPath: .status.conditions[-1:].message
      name: Details
      type: string
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              stage:
                type: string
                enum:
                - Idle
                - Prepare
                - Configure
                - Rollback
              pullSecretRef:
                type: string
              ipv4:
                type: object
                properties:
                  address:
                    type: string
                  gateway:
                    type: string
                  machineNetwork:
                    type: string
                  dnsServer:
                    type: string
              ipv6:
                type: object
                properties:
                  address:
                    type: string
                  gateway:
                    type: string
                  machineNetwork:
                    type: string
                  dnsServer:
                    type: string
              vlan:
                type: object
                properties:
                  id:
                    type: integer
              proxy:
                type: object
                properties:
                  httpProxy:
                    type: string
                  httpsProxy:
                    type: string
                  noProxy:
                    type: array
                    items:
                      type: string
              recertImage:
                type: string
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              stage:
                type: string
              validNextStages:
                type: array
                items:
                  type: string
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
              currentHostNetwork:
                type: object
                properties:
                  vlan:
                    type: object
                    properties:
                      id:
                        type: integer
                  ipv4:
                    type: object
                    properties:
                      address:
                        type: string
                      gateway:
                        type: string
                      machineNetwork:
                        type: string
                      dnsServer:
                        type: string
                  ipv6:
                    type: object
                    properties:
                      address:
                        type: string
                      gateway:
                        type: string
                      machineNetwork:
                        type: string
                      dnsServer:
                        type: string
              currentClusterIPs:
                type: object
                properties:
                  nodeInternalIPs:
                    type: array
                    items:
                      type: object
                      properties:
                        family:
                          type: string
                        address:
                          type: string
              history:
                type: array
                items:
                  type: object
                  properties:
                    stage:
                      type: string
                    startedAt:
                      type: string
                      format: date-time
                    completionTime:
                      type: string
                      format: date-time

